<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepMás">
  <meta name="description" content="Registra tus entrenamientos y descubre cuándo subir, mantener o bajar el peso.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>RepMás · Progresión de cargas</title>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" type="button" data-action="nav" data-tab="home" aria-label="Ir a inicio">
        <span class="brand-mark">R<span>+</span></span><span class="brand-word">REP<span>MÁS</span></span>
      </button>
      <button class="icon-btn" type="button" data-action="settings" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1 1.3 1-1.5 2.6-1.5-.6a9 9 0 0 1-1.8 1.1l-.2 1.6h-3l-.3-1.6a8 8 0 0 1-2.1 0l-.3 1.6h-3L8 19.2a9 9 0 0 1-1.8-1.1l-1.5.6-1.5-2.6 1.3-1a9 9 0 0 1 0-2.2l-1.3-1 1.5-2.6 1.5.6A9 9 0 0 1 8 8.8l.2-1.6h3l.3 1.6a8 8 0 0 1 2.1 0l.3-1.6h3l.2 1.6a9 9 0 0 1 1.8 1.1l1.5-.6 1.5 2.6-1.3 1a9 9 0 0 1 0 2.1Z" transform="translate(-.5 -1.2)"/></svg>
      </button>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="bottomnav" aria-label="Navegación principal">
      <button data-action="nav" data-tab="home" class="nav-btn active" aria-label="Inicio"><span class="nav-ico">⌂</span><span>Inicio</span></button>
      <button data-action="nav" data-tab="train" class="nav-btn" aria-label="Entrenar"><span class="nav-ico">▣</span><span>Entrenar</span></button>
      <button data-action="nav" data-tab="library" class="nav-btn" aria-label="Ejercicios"><span class="nav-ico">▤</span><span>Ejercicios</span></button>
      <button data-action="nav" data-tab="history" class="nav-btn" aria-label="Progreso"><span class="nav-ico">↗</span><span>Progreso</span></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"><div id="modal-inner"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="backupFile" type="file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
